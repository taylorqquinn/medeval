# Azure Pipelines: Smoke Tests (PR merge gate)
#
# Purpose: a FAST, must-pass check that blocks merging into main if it fails.
# This is intentionally a small, curated subset of tests/imports covering one
# representative case per evaluator category - not the full suite. The full
# matrix (all OS/Python versions, full pytest run) lives in
# azure-pipelines.yml and is the deeper/slower CI gate.
#
# To make this a required merge gate:
#   Azure DevOps -> Project Settings -> Repos -> Branch Policies -> main
#   -> Build Validation -> add this pipeline -> check "Required"
#
# Target runtime: under a couple of minutes, single OS/Python combo, no matrix.

trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  PYTHONPATH: $(System.DefaultWorkingDirectory)/src

steps:
  - checkout: self
    fetchDepth: 1

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"
    displayName: "Use Python 3.12"

  - task: Cache@2
    displayName: "Cache pip dependencies"
    inputs:
      key: 'smoke-pip | "$(Agent.OS)" | poetry.lock'
      restoreKeys: 'smoke-pip | "$(Agent.OS)"'
      path: $(Pipeline.Workspace)/.pip-cache

  - script: |
      python -m pip install --upgrade pip
      pip install poetry
      poetry install --no-interaction --no-root
    displayName: "Install dependencies (poetry install)"

  # ---------------------------------------------------------------------
  # Smoke 1: package imports cleanly and exposes its public API.
  # Fails fast if __init__.py, a submodule, or a dependency is broken,
  # before spending time on the rest of the suite.
  # ---------------------------------------------------------------------
  - script: |
      poetry run python -c "
      from medeval import ClinicalCase, Prediction, EvaluationRunner, load_dataset
      from medeval.models import RetrievedDocument
      from medeval.evaluators import (
          MedicationF1Evaluator, RequiredFactsEvaluator, ForbiddenFactsEvaluator,
          EntityExtractionEvaluator, FormatValidator, CalibrationEvaluator,
          LLMJudgeEvaluator, RetrievalEvaluator, HallucinationDetectorEvaluator,
          FaithfulnessEvaluator, PromptInjectionDetectorEvaluator,
          AdversarialRobustnessEvaluator, SafetyGuardEvaluator,
          PerformanceEvaluator, ReliabilityEvaluator,
      )
      from medeval.evaluation.runner import EvaluationRunner as _Runner
      from medeval.evaluation.statistics import StatisticalComparator
      from medeval.evaluation.quality_gate import evaluate_quality_gate
      from medeval.evaluation.metrics import aggregate
      from medeval.evaluation.baseline import load_baseline
      from medeval.evaluation.human_eval import HumanRating, HumanEvaluationWorkflow
      print('OK: all public imports resolved')
      "
    displayName: "Smoke 1: import medeval public API"

  # ---------------------------------------------------------------------
  # Smoke 2: end-to-end wiring. Build one case/prediction and run it
  # through EvaluationRunner with one evaluator from each category, so a
  # broken constructor signature or field rename fails the merge gate.
  # ---------------------------------------------------------------------
  - script: |
      poetry run python -c "
      from medeval.models import ClinicalCase, Prediction
      from medeval.evaluation.runner import EvaluationRunner
      from medeval.evaluators import (
          MedicationF1Evaluator, RequiredFactsEvaluator, ForbiddenFactsEvaluator,
          SafetyGuardEvaluator, PerformanceEvaluator,
      )

      case = ClinicalCase(
          id='smoke_001',
          text='Patient with chest pain and shortness of breath.',
          symptoms=['chest pain', 'shortness of breath'],
          medications=['aspirin', 'nitroglycerin'],
          required_facts=['cardiac'],
          forbidden_facts=['definitely cancer'],
          gold_summary={'summary_text': 'Likely acute coronary syndrome.'},
      )
      prediction = Prediction(
          case_id='smoke_001',
          summary_text='Cardiac emergency suspected. Consult cardiology.',
          medications=['aspirin', 'metoprolol'],
          latency_ms=120.0,
          cost_usd=0.002,
      )

      runner = EvaluationRunner(evaluators=[
          MedicationF1Evaluator(),
          RequiredFactsEvaluator(),
          ForbiddenFactsEvaluator(),
          SafetyGuardEvaluator(),
          PerformanceEvaluator(latency_sla_ms=500.0),
      ])
      result = runner.evaluate_case(case, prediction)
      assert not result.errors, f'evaluator errors: {result.errors}'
      assert 'med_f1' in result.metrics
      print('OK: end-to-end runner wiring produced', result.metrics)

      results = runner.run([case], [prediction])
      assert results.case_results, 'no case results produced'
      assert results.aggregated_metrics, 'no aggregated metrics produced'
      print('OK: aggregate run produced', results.aggregated_metrics)
      "
    displayName: "Smoke 2: EvaluationRunner end-to-end wiring"

  # ---------------------------------------------------------------------
  # Smoke 3: one fast, representative pytest per evaluator/utility
  # category (not the full suite - see azure-pipelines.yml for that).
  # ---------------------------------------------------------------------
  - script: |
      poetry run pytest -v \
        tests/unit/dataset/test_dataset.py::test_load_cases_jsonl \
        tests/unit/evaluators/test_medication_f1.py::test_medication_f1_exact_match \
        tests/unit/evaluators/test_required_forbidden.py \
        tests/unit/evaluators/test_format_validator.py::test_format_validator_missing_and_present \
        tests/unit/evaluators/test_entity_extraction.py::test_entity_extraction_basic \
        tests/unit/evaluators/test_calibration.py::test_calibration_evaluator_judge_and_confidence \
        tests/unit/evaluators/test_retrieval.py::test_retrieval_perfect_ranking \
        tests/unit/evaluators/test_hallucination.py::test_hallucination_clean_output \
        tests/unit/evaluators/test_hallucination.py::test_faithfulness_fully_grounded \
        tests/unit/evaluators/test_safety.py::test_prompt_injection_clean_input \
        tests/unit/evaluators/test_safety.py::test_adversarial_robustness_baseline \
        tests/unit/evaluators/test_safety.py::test_safety_guard_safe_output \
        tests/unit/evaluators/test_performance.py::test_performance_within_sla \
        tests/unit/evaluators/test_performance.py::test_reliability_successful_prediction \
        tests/unit/evaluation/test_quality_gate.py::test_quality_gate_pass_and_fail \
        tests/unit/evaluation/test_metrics.py::test_aggregate_numeric_and_list \
        tests/unit/evaluation/test_statistics.py::test_statistical_comparator_significant_improvement
    displayName: "Smoke 3: one representative pytest per category"
