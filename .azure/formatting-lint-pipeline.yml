# Azure Pipelines: Formatting & Lint (PR merge gate)
#
# Purpose: block merges into main if the codebase is not black-formatted, has
# ruff lint errors, or scores below the pylint quality bar. This is a code
# QUALITY gate, distinct from smoke-tests-pipeline.yml (functional smoke
# tests) and azure-pipelines.yml (full test matrix). All three can be added
# as separate required Build Validation policies on the same branch.
#
# Tool roles (see pyproject.toml for full configuration of each):
#   - black  : the formatter. `black --check` fails the build if any file
#              would be reformatted; it never fails on a style opinion black
#              doesn't hold, only on files that disagree with its own output.
#   - ruff   : fast linter (replaces flake8-style checks) for correctness
#              issues - unused imports/variables, import order, line length,
#              a subset of flake8-bugbear checks - configured under
#              [tool.ruff] / [tool.ruff.lint] in pyproject.toml.
#   - pylint : deeper static analysis (design smells, broad excepts, missing
#              super().__init__() calls, etc.) configured under
#              [tool.pylint.*] in pyproject.toml. Gated on a minimum score
#              rather than "zero findings" since pylint is intentionally
#              stricter/noisier than ruff.
#
# To make this a required merge gate:
#   Azure DevOps -> Project Settings -> Repos -> Branch Policies -> main
#   -> Build Validation -> add this pipeline -> check "Required"

trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  PYTHONPATH: $(System.DefaultWorkingDirectory)/src
  # Minimum pylint score (out of 10) required to pass the gate.
  PYLINT_FAIL_UNDER: "9.5"

steps:
  - checkout: self
    fetchDepth: 1

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"
    displayName: "Use Python 3.12"

  - task: Cache@2
    displayName: "Cache pip dependencies"
    inputs:
      key: 'format-lint-pip | "$(Agent.OS)" | poetry.lock'
      restoreKeys: 'format-lint-pip | "$(Agent.OS)"'
      path: $(Pipeline.Workspace)/.pip-cache

  - script: |
      python -m pip install --upgrade pip
      pip install poetry
      poetry install --no-interaction --no-root
    displayName: "Install dependencies (poetry install, incl. black/ruff/pylint)"

  # ---------------------------------------------------------------------
  # Gate 1: black --check
  # Fails the build (does not rewrite files) if anything is not formatted
  # per [tool.black] in pyproject.toml. Fix locally with `poetry run black
  # src tests` and commit the result.
  # ---------------------------------------------------------------------
  - script: |
      poetry run black --check --diff src tests
    displayName: "Gate 1: black --check --diff src tests"

  # ---------------------------------------------------------------------
  # Gate 2: ruff check
  # Fails the build on any lint error per [tool.ruff]/[tool.ruff.lint] in
  # pyproject.toml. Fix locally with `poetry run ruff check --fix src
  # tests` (then re-run black, since some fixes can change formatting).
  # ---------------------------------------------------------------------
  - script: |
      poetry run ruff check --output-format=github src tests
    displayName: "Gate 2: ruff check src tests"

  # ---------------------------------------------------------------------
  # Gate 3: pylint, gated on a minimum score rather than zero findings.
  # `--fail-under` makes pylint's own exit code reflect the threshold, and
  # `--output-format` gives readable annotations in the pipeline log.
  # Per-check disables/thresholds live in [tool.pylint.*] in pyproject.toml.
  # ---------------------------------------------------------------------
  - script: |
      poetry run pylint src/medeval --fail-under=$(PYLINT_FAIL_UNDER) --output-format=colorized
    displayName: "Gate 3: pylint src/medeval (fail-under $(PYLINT_FAIL_UNDER)/10)"

  # ---------------------------------------------------------------------
  # Gate 4: pylint on the test suite too, but only for real correctness
  # issues (errors/warnings), not the stricter design/refactor checks that
  # make sense for library code but not test code.
  # ---------------------------------------------------------------------
  - script: |
      poetry run pylint tests --disable=all --enable=E,W --fail-under=10
    displayName: "Gate 4: pylint tests (errors/warnings only)"
