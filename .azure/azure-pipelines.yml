# Azure Pipelines CI for MedEval Framework
#
# Runs the full pytest suite across every supported OS/Python combination so
# that regressions are caught regardless of platform. The framework has no
# runtime dependencies (see pyproject.toml), so each job installs only the
# Poetry dev dependencies needed to run tests, coverage, and linting.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  # Keep pip's cache warm across pipeline runs for faster installs.
  PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache

stages:
  - stage: Lint
    displayName: "Lint"
    jobs:
      - job: Flake8
        displayName: "flake8"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
            displayName: "Use Python 3.12"

          - script: |
              python -m pip install --upgrade pip
              pip install flake8
            displayName: "Install flake8"

          - script: |
              flake8 src tests
            displayName: "Run flake8"

  - stage: Test
    displayName: "Test"
    dependsOn: Lint
    jobs:
      - job: Matrix
        displayName: "pytest"
        strategy:
          matrix:
            Linux_Python312:
              vmImageName: "ubuntu-latest"
              pythonVersion: "3.12"
            Linux_Python313:
              vmImageName: "ubuntu-latest"
              pythonVersion: "3.13"
            Windows_Python312:
              vmImageName: "windows-latest"
              pythonVersion: "3.12"
            Windows_Python313:
              vmImageName: "windows-latest"
              pythonVersion: "3.13"
            macOS_Python312:
              vmImageName: "macOS-latest"
              pythonVersion: "3.12"
            macOS_Python313:
              vmImageName: "macOS-latest"
              pythonVersion: "3.13"
        pool:
          vmImage: $(vmImageName)
        steps:
          - checkout: self
            fetchDepth: 1

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - task: Cache@2
            displayName: "Cache pip dependencies"
            inputs:
              key: 'pip | "$(Agent.OS)" | "$(pythonVersion)" | poetry.lock'
              restoreKeys: |
                pip | "$(Agent.OS)" | "$(pythonVersion)"
              path: $(PIP_CACHE_DIR)

          - script: |
              python -m pip install --upgrade pip
              pip install poetry
            displayName: "Install Poetry"

          - script: |
              poetry install --no-interaction --no-root
            displayName: "Install dependencies (poetry install)"

          - script: |
              poetry run pytest tests/ -v --junitxml=test-results.xml --cov=src/medeval --cov-report=xml --cov-report=html
            displayName: "Run full test suite with coverage"

          - task: PublishTestResults@2
            condition: always()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "test-results.xml"
              testRunTitle: "pytest-$(Agent.OS)-py$(pythonVersion)"
            displayName: "Publish test results"

          - task: PublishCodeCoverageResults@1
            condition: always()
            inputs:
              codeCoverageTool: "Cobertura"
              summaryFileLocation: "coverage.xml"
              reportDirectory: "htmlcov"
            displayName: "Publish coverage results"
