trigger:
  branches:
    include:
    - main
    - develop

pr:
  branches:
    include:
    - main
    - develop

pool:
  vmImage: 'ubuntu-latest'

variables:
  python.version: '3.12'

stages:
- stage: Test
  displayName: 'Test Stage'
  jobs:
  - job: UnitTests
    displayName: 'Run Unit Tests'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(python.version)'
      displayName: 'Use Python $(python.version)'

    - script: |
        mkdir -p $(Agent.HomeDirectory)/.cache/pip
      displayName: 'Ensure pip cache dir exists'

    - task: Cache@2
      displayName: 'Cache pip dependencies'
      inputs:
        key: 'pip | "$(Agent.OS)" | requirements.txt'
        restoreKeys: 'pip | "$(Agent.OS)"'
        path: '$(Agent.HomeDirectory)/.cache/pip'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
      displayName: 'Install dependencies'

    - script: |
        export PYTHONPATH=$(pwd)/src
        python -m pytest tests/unit/ -v --junitxml=test-results.xml --cov=src/medeval --cov-report=xml --cov-report=html
      displayName: 'Run unit tests with coverage'

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: 'test-results.xml'
        testRunTitle: 'Unit Tests'
      displayName: 'Publish test results'

    - task: PublishCodeCoverageResults@1
      condition: always()
      inputs:
        codeCoverageTool: 'Cobertura'
        summaryFileLocation: 'coverage.xml'
        reportDirectory: 'htmlcov'
      displayName: 'Publish coverage results'

  - job: IntegrationTests
    displayName: 'Run Integration Tests'
    dependsOn: UnitTests
    steps:
    - checkout: self
      fetchDepth: 1

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(python.version)'
      displayName: 'Use Python $(python.version)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install dependencies'

    - script: |
        export PYTHONPATH=$(pwd)/src
        python tests/software/test_full_pipeline.py
      displayName: 'Run full pipeline integration test'
      env:
        OPENAI_API_KEY: $(OPENAI_API_KEY)

    - script: |
        export PYTHONPATH=$(pwd)/src
        python -m medeval list-runs --limit 5
      displayName: 'Verify CLI functionality'

    - task: PublishBuildArtifacts@1
      condition: always()
      inputs:
        PathtoPublish: '.logs'
        ArtifactName: 'medeval-logs'
        publishLocation: 'Container'
      displayName: 'Publish logs and artifacts'

- stage: Quality
  displayName: 'Code Quality'
  dependsOn: Test
  jobs:
  - job: CodeQuality
    displayName: 'Code Quality Checks'
    steps:
    - checkout: self
      fetchDepth: 1

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(python.version)'
      displayName: 'Use Python $(python.version)'

    - script: |
        python -m pip install --upgrade pip
        pip install pylint flake8
      displayName: 'Install linting tools'

    - script: |
        python -m compileall src/medeval
      displayName: 'Check Python syntax'
      continueOnError: true

    - script: |
        flake8 src/medeval --count --select=E9,F63,F7,F82 --show-source --statistics
      displayName: 'Run flake8 (errors only)'
      continueOnError: true

