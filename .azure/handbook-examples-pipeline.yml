# Azure Pipelines: AI Testing Handbook walkthrough
#
# This pipeline does NOT gate merges (see azure-pipelines.yml for the real CI
# gate). Instead it is a teaching companion to AI_TESTING_HANDBOOK.html: one
# job per handbook concept, each running the exact pytest command (with the
# arguments it needs) that demonstrates that concept against real MedEval
# evaluators. Run it manually, or read the `script:` steps below and copy the
# commands straight into your own terminal while you read the handbook.
#
# Handbook: AI_TESTING_HANDBOOK.html (open locally in a browser)
# Source of truth for every command below: tests/unit/** and src/medeval/**

trigger: none
pr: none

pool:
  vmImage: "ubuntu-latest"

variables:
  PYTHONPATH: $(System.DefaultWorkingDirectory)/src

stages:
  - stage: Setup
    displayName: "Install once"
    jobs:
      - job: Install
        displayName: "poetry install"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
            displayName: "Use Python 3.12"
          - script: |
              python -m pip install --upgrade pip
              pip install poetry
              poetry install --no-interaction --no-root
            displayName: "poetry install"

  - stage: Handbook
    displayName: "Handbook concepts (1-16)"
    dependsOn: Setup
    jobs:
      # -----------------------------------------------------------------
      # Concept 1: Golden Datasets & Test Construction
      # Handbook anchor: AI_TESTING_HANDBOOK.html#concept1
      # Demonstrates: medeval.dataset.load_cases() parsing a JSONL golden
      # dataset into ClinicalCase objects. No extra args needed beyond -v.
      # -----------------------------------------------------------------
      - job: Concept01_GoldenDatasets
        displayName: "1. Golden Datasets"
        steps:
          - script: |
              poetry run pytest tests/unit/dataset/test_dataset.py -v
            displayName: "pytest tests/unit/dataset/test_dataset.py -v"

      # -----------------------------------------------------------------
      # Concept 2: Exact-Match Evaluators
      # Handbook anchor: #concept2
      # Demonstrates: MedicationF1Evaluator (med_precision/med_recall/med_f1)
      # -----------------------------------------------------------------
      - job: Concept02_ExactMatch
        displayName: "2. Exact-Match Evaluators"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_medication_f1.py -v
            displayName: "pytest tests/unit/evaluators/test_medication_f1.py -v"

      # -----------------------------------------------------------------
      # Concept 3: Deterministic Evaluators
      # Handbook anchor: #concept3
      # Demonstrates: RequiredFactsEvaluator, ForbiddenFactsEvaluator,
      # FormatValidator, and (bonus, not in the handbook) EntityExtractionEvaluator.
      # -k lets you isolate just one evaluator's tests, e.g.:
      #   poetry run pytest tests/unit/evaluators/test_required_forbidden.py -v -k forbidden
      # -----------------------------------------------------------------
      - job: Concept03_Deterministic
        displayName: "3. Deterministic Evaluators"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_required_forbidden.py -v
            displayName: "Required/forbidden facts: pytest test_required_forbidden.py -v"
          - script: |
              poetry run pytest tests/unit/evaluators/test_format_validator.py -v
            displayName: "Format validation: pytest test_format_validator.py -v"
          - script: |
              poetry run pytest tests/unit/evaluators/test_entity_extraction.py -v
            displayName: "Entity extraction (bonus): pytest test_entity_extraction.py -v"

      # -----------------------------------------------------------------
      # Concept 4: Semantic Similarity
      # Handbook anchor: #concept4
      # MedEval ships a deterministic fallback judge, not embeddings, so
      # there is no dedicated pytest file. Run the module inline instead:
      # -----------------------------------------------------------------
      - job: Concept04_SemanticSimilarity
        displayName: "4. Semantic Similarity"
        dependsOn: []
        steps:
          - script: |
              poetry run python -c "
              from medeval.llm_judge import DeterministicJudge
              judge = DeterministicJudge()
              print('identical      ->', judge.judge('acute mi', 'acute mi'))
              print('paraphrase     ->', judge.judge('acute mi', 'acute mi confirmed'))
              print('unrelated      ->', judge.judge('acute mi', 'benign rash'))
              "
            displayName: "python -c ... (DeterministicJudge demo, src/medeval/llm_judge.py)"

      # -----------------------------------------------------------------
      # Concept 5: LLM-as-a-Judge
      # Handbook anchor: #concept5
      # No dedicated pytest file; demonstrates LLMJudgeEvaluator with a
      # custom judge object satisfying the LLMJudge protocol.
      # -----------------------------------------------------------------
      - job: Concept05_LLMAsJudge
        displayName: "5. LLM-as-a-Judge"
        dependsOn: []
        steps:
          - script: |
              poetry run python -c "
              from medeval.models import ClinicalCase, Prediction
              from medeval.evaluators import LLMJudgeEvaluator

              class MyJudge:
                  def judge(self, gold_text, pred_text):
                      return 0.87

              case = ClinicalCase(
                  id='case_001', text='...', symptoms=[], medications=[],
                  required_facts=[], forbidden_facts=[],
                  gold_summary={'summary_text': 'Acute coronary syndrome.'},
              )
              prediction = Prediction(case_id='case_001', summary_text='ACS suspected.', medications=[])
              result = LLMJudgeEvaluator(llm_judge=MyJudge()).evaluate(case, prediction)
              print(result)
              "
            displayName: "python -c ... (LLMJudgeEvaluator with custom judge)"

      # -----------------------------------------------------------------
      # Concept 6: Human Evaluation
      # Handbook anchor: #concept6
      # No dedicated pytest file; demonstrates HumanEvaluationWorkflow and
      # inter-rater reliability from src/medeval/evaluation/human_eval.py.
      # -----------------------------------------------------------------
      - job: Concept06_HumanEvaluation
        displayName: "6. Human Evaluation"
        dependsOn: []
        steps:
          - script: |
              poetry run python -c "
              from medeval.evaluation.human_eval import HumanRating, HumanEvaluationWorkflow

              workflow = HumanEvaluationWorkflow()
              workflow.add_rating(HumanRating(case_id='case_001', rater_id='rater_a', accuracy=5, safety=5, helpfulness=4))
              workflow.add_rating(HumanRating(case_id='case_001', rater_id='rater_b', accuracy=4, safety=5, helpfulness=4))
              print(workflow.get_aggregated_ratings('case_001'))
              print(workflow.calculate_inter_rater_reliability('accuracy'))
              "
            displayName: "python -c ... (HumanEvaluationWorkflow demo)"

      # -----------------------------------------------------------------
      # Concept 7: RAG Retrieval Metrics
      # Handbook anchor: #concept7
      # Demonstrates: RetrievalEvaluator (precision@k/recall@k/MRR/NDCG@k).
      # -k "k_parameter" isolates the test that varies the k argument.
      # -----------------------------------------------------------------
      - job: Concept07_RAGRetrieval
        displayName: "7. RAG Retrieval Metrics"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_retrieval.py -v
            displayName: "pytest tests/unit/evaluators/test_retrieval.py -v"
          - script: |
              poetry run pytest tests/unit/evaluators/test_retrieval.py -v -k k_parameter
            displayName: "Isolate the k= argument test: -k k_parameter"

      # -----------------------------------------------------------------
      # Concept 8: Precision, Recall, and F1
      # Handbook anchor: #concept8
      # Reuses MedicationF1Evaluator and RetrievalEvaluator: run both
      # together to see precision/recall/F1 in two different evaluators.
      # -----------------------------------------------------------------
      - job: Concept08_PrecisionRecallF1
        displayName: "8. Precision, Recall, F1"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_medication_f1.py tests/unit/evaluators/test_retrieval.py -v
            displayName: "pytest test_medication_f1.py test_retrieval.py -v"

      # -----------------------------------------------------------------
      # Concept 9: Hallucination Testing
      # Handbook anchor: #concept9
      # Demonstrates: HallucinationDetectorEvaluator. strict_mode is a
      # constructor argument, not a CLI flag; the -k filter below selects
      # only the tests that exercise it.
      # -----------------------------------------------------------------
      - job: Concept09_Hallucination
        displayName: "9. Hallucination Testing"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_hallucination.py -v -k hallucination
            displayName: "pytest test_hallucination.py -v -k hallucination"

      # -----------------------------------------------------------------
      # Concept 10: Faithfulness
      # Handbook anchor: #concept10
      # Demonstrates: FaithfulnessEvaluator (same module/file as Concept 9,
      # different tests). min_overlap_threshold is a constructor argument.
      # -----------------------------------------------------------------
      - job: Concept10_Faithfulness
        displayName: "10. Faithfulness"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_hallucination.py -v -k faithfulness
            displayName: "pytest test_hallucination.py -v -k faithfulness"

      # -----------------------------------------------------------------
      # Concept 11: Safety & Adversarial Testing
      # Handbook anchor: #concept11
      # Demonstrates: SafetyGuardEvaluator.
      # -----------------------------------------------------------------
      - job: Concept11_Safety
        displayName: "11. Safety & Adversarial Testing"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_safety.py -v -k safety_guard
            displayName: "pytest test_safety.py -v -k safety_guard"

      # -----------------------------------------------------------------
      # Concept 12: Prompt Injection Detection
      # Handbook anchor: #concept12
      # Demonstrates: PromptInjectionDetectorEvaluator (same file as
      # Concept 11, filtered to the injection-specific tests).
      # -----------------------------------------------------------------
      - job: Concept12_PromptInjection
        displayName: "12. Prompt Injection Detection"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_safety.py -v -k prompt_injection
            displayName: "pytest test_safety.py -v -k prompt_injection"

      # -----------------------------------------------------------------
      # Concept 13: Robustness Testing
      # Handbook anchor: #concept13
      # Demonstrates: AdversarialRobustnessEvaluator (same file as
      # Concepts 11-12, filtered to the robustness-specific tests).
      # -----------------------------------------------------------------
      - job: Concept13_Robustness
        displayName: "13. Robustness Testing"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_safety.py -v -k adversarial_robustness
            displayName: "pytest test_safety.py -v -k adversarial_robustness"

      # -----------------------------------------------------------------
      # Concept 14: Performance, Latency, Cost, Reliability
      # Handbook anchor: #concept14
      # Demonstrates: PerformanceEvaluator (latency_sla_ms / cost_sla_usd
      # constructor arguments) and ReliabilityEvaluator.
      # -----------------------------------------------------------------
      - job: Concept14_Performance
        displayName: "14. Performance & Reliability"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluators/test_performance.py -v -k "not reliability"
            displayName: "SLA checks: pytest test_performance.py -v -k \"not reliability\""
          - script: |
              poetry run pytest tests/unit/evaluators/test_performance.py -v -k reliability
            displayName: "Error/timeout checks: pytest test_performance.py -v -k reliability"

      # -----------------------------------------------------------------
      # Concept 15: Model Regression & Quality Gates
      # Handbook anchor: #concept15
      # Demonstrates: evaluate_quality_gate(aggregated_metrics, baseline).
      # Both arguments are plain dicts of metric_name -> float; no CLI
      # flags are involved, only the two positional function arguments.
      # -----------------------------------------------------------------
      - job: Concept15_QualityGates
        displayName: "15. Model Regression & Quality Gates"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluation/test_quality_gate.py -v
            displayName: "pytest tests/unit/evaluation/test_quality_gate.py -v"
          - script: |
              poetry run pytest tests/unit/evaluation/test_metrics.py -v
            displayName: "Aggregation feeding the gate: pytest test_metrics.py -v"

      # -----------------------------------------------------------------
      # Concept 16: Statistical Comparison & Calibration
      # Handbook anchor: #concept16
      # Demonstrates: StatisticalComparator.compare_means(name, baseline,
      # candidate) and CalibrationEvaluator. significance_level is a
      # constructor argument to StatisticalComparator.
      # -----------------------------------------------------------------
      - job: Concept16_StatsAndCalibration
        displayName: "16. Statistical Comparison & Calibration"
        dependsOn: []
        steps:
          - script: |
              poetry run pytest tests/unit/evaluation/test_statistics.py -v
            displayName: "pytest tests/unit/evaluation/test_statistics.py -v"
          - script: |
              poetry run pytest tests/unit/evaluators/test_calibration.py -v
            displayName: "pytest tests/unit/evaluators/test_calibration.py -v"

  - stage: RunAll
    displayName: "Run every handbook example back-to-back"
    dependsOn: Handbook
    jobs:
      - job: AllConcepts
        displayName: "Full narrated run (-v, no filtering)"
        steps:
          # Same tests as every job above, run together in handbook order,
          # with verbose per-test output so you can follow along top to
          # bottom while reading AI_TESTING_HANDBOOK.html.
          - script: |
              poetry run pytest \
                tests/unit/dataset/test_dataset.py \
                tests/unit/evaluators/test_medication_f1.py \
                tests/unit/evaluators/test_required_forbidden.py \
                tests/unit/evaluators/test_format_validator.py \
                tests/unit/evaluators/test_entity_extraction.py \
                tests/unit/evaluators/test_retrieval.py \
                tests/unit/evaluators/test_hallucination.py \
                tests/unit/evaluators/test_safety.py \
                tests/unit/evaluators/test_performance.py \
                tests/unit/evaluation/test_quality_gate.py \
                tests/unit/evaluation/test_metrics.py \
                tests/unit/evaluation/test_statistics.py \
                tests/unit/evaluators/test_calibration.py \
                -v
            displayName: "pytest <all handbook test files, in concept order> -v"
