trigger:
- main

pr:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  python.version: '3.10'

jobs:
- job: test_and_evaluate
  displayName: 'Run tests and MedEval evaluation (Microsoft-hosted agent)'
  pool:
    vmImage: 'ubuntu-latest'
  steps:
  - checkout: self
    fetchDepth: 1

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(python.version)'

  - task: Cache@2
    displayName: 'Cache pip'
    inputs:
      key: 'pip | "$(Agent.OS)" | **/requirements.txt'
      restoreKeys: 'pip | "$(Agent.OS)"'
      path: ~/.cache/pip

  - script: |
      python -m pip install --upgrade pip
      if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      python -m pip install pytest
    displayName: 'Install dependencies'

  - script: |
      export PYTHONPATH=$(pwd)/src
      python -m pytest -q
    displayName: 'Run unit tests'

  - script: |
      export PYTHONPATH=$(pwd)/src
      python scripts/run_evaluation.py --dataset datasets/clinical_cases.jsonl --baseline baselines/production.json --output results.json
    displayName: 'Run MedEval evaluation'
    env:
      OPENAI_API_KEY: $(OPENAI_API_KEY)

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: 'results.json'
      ArtifactName: 'mdeval-results'
      publishLocation: 'Container'

